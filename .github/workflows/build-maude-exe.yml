name: Build maude.exe
on:
  workflow_dispatch:
  workflow_call:   # called by release.yml
  push:
    branches: [main]
    paths:
      - light/maude_exe.py
      - .github/workflows/build-maude-exe.yml
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller==6.11.1
      - name: Inject version (tag name, else dev)
        shell: bash
        run: |
          V=dev
          [ "$GITHUB_REF_TYPE" = tag ] && V="$GITHUB_REF_NAME"
          sed -i "s/^VERSION = .*/VERSION = \"$V\"/" light/maude_exe.py
          grep '^VERSION' light/maude_exe.py
      - run: pyinstaller --onefile --console --name maude light/maude_exe.py
      - name: Smoke test
        run: ./dist/maude.exe --version
        env:
          MAUDE_NO_INSTALL: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: maude-exe
          path: dist/maude.exe
