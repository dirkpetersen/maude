name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  # ── Fail early if light/checksums.txt is missing or stale ──────────────────
  # Pinned installs (setup-wsl-maude.ps1 -Release <tag>) need it. Use `make tag`,
  # which regenerates and commits it before tagging.
  verify-checksums:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify light/checksums.txt
        run: bash scripts/gen-checksums.sh --check

  # ── Build maude.exe (Windows launcher) ─────────────────────────────────────
  build-exe:
    uses: ./.github/workflows/build-maude-exe.yml

  # ── Create GitHub Release ─────────────────────────────────────────────────
  create-release:
    runs-on: ubuntu-latest
    needs: [verify-checksums, build-exe]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download maude.exe artifact
        uses: actions/download-artifact@v4
        with:
          name: maude-exe
          path: dist/

      - name: Checksum maude.exe
        run: cd dist && sha256sum maude.exe > maude.exe.sha256

      - name: Generate release notes from template
        run: |
          VERSION="${{ github.ref_name }}"
          sed "s/MAUDE_VERSION/${VERSION}/g" \
            .github/release-notes-template.md > /tmp/release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.ref_name }}"
          gh release create "${VERSION}" \
            --title "maude ${VERSION}" \
            --notes-file /tmp/release-notes.md \
            dist/maude.exe \
            dist/maude.exe.sha256

  # Redeploy the docs site so the maude.exe links point at this release.
  # The github-pages environment only accepts deploys from main, so dispatch
  # docs.yml on main instead of calling it (a called workflow would run on the tag ref).
  update-docs:
    needs: create-release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch docs.yml on main
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$TAG"
